name: PR

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main
  # path filter won't work bcz PR status check will be 'pending' if workflow is
  # skipped due to path filtering, i.e. blocked
  #paths:

  workflow_dispatch:

jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      run: ${{ steps.filter.outputs.code }}
    steps:
      # For pull requests it's not necessary to checkout the code
      # but it's useful to see the effect of the path filter in current PR
      - uses: actions/checkout@v4
        with:
          # This may save additional git fetch roundtrip if
          # merge-base is found within latest 20 commits
          fetch-depth: 20
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          # Path to file where filters are defined
          filters: .github/filters.yaml
          #predicate-quantifier: 'every' # check dorny/paths-filter#225

  test:
    needs: changes
    #  only run only if there are changes and non-draft PRs
    if: ${{ needs.changes.outputs.run == 'true' && !github.event.pull_request.draft}}
    runs-on: ubuntu-latest

    # NOTE: postgres cannot be a job "service" because its image is not
    # published to any registry; it is built from contrib/docker in a step
    # below, before the tests that need it.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Taskfile
        uses: arduino/setup-task@v2
        with:
          # higher Github API rate limiting
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          check-latest: true

      - name: Initialize Go workspace
        run: |
          task work

      - name: Lint
        uses: golangci/golangci-lint-action@v6.5.0
        with:
          install-mode: "binary"
          version: "latest"
          args: ./... ./core/... --timeout=10m --config=.golangci.yml

      # postgres for the unit tests, built locally since the image is not
      # published to a registry
      - name: Build postgres image
        run: |
          task pg:image

      - name: Start postgres
        run: |
          docker run -d --name kwil-ci-postgres -p 5432:5432 --shm-size 512m \
            -e POSTGRES_HOST_AUTH_METHOD=trust kwil-postgres:16.15-1
          # pg_isready alone is not enough: it reports ready while the init
          # scripts that create kwild/kwil_test_db are still running, and
          # before the server accepts TCP connections.
          for _ in $(seq 60); do
            if docker exec kwil-ci-postgres psql -U kwild -d kwil_test_db -c 'select 1' >/dev/null 2>&1 \
              && timeout 1 bash -c '> /dev/tcp/127.0.0.1/5432' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready" >&2
          docker logs kwil-ci-postgres >&2
          exit 1

      - name: Run unit test
        run: |
          task test:unit

      - name: compile the core/client/example app
        run: go build -o /dev/null
        working-directory: core/client/example

  acceptance:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && !github.event.pull_request.draft}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Taskfile
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          check-latest: true

      - name: Initialize Go workspace
        run: |
          task work

      # acceptance compose files use kwil-postgres:16.15-1, which is not published
      - name: Build postgres image
        run: |
          task pg:image

      # Built on the runner so setup-go's build cache is reused; compiling
      # inside Docker starts cold on every source change.
      - name: Build kwild and kwil-cli
        env:
          CGO_ENABLED: "0"
        run: |
          task build:kwild
          task build:cli

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Build kwild image
        uses: docker/build-push-action@v6
        with:
          context: .build
          load: true
          builder: ${{ steps.buildx.outputs.name }}
          file: ./contrib/docker/kwild.ci.dockerfile
          push: false
          tags: kwild:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run acceptance test
        run: |
          testUserID=$(id -u)
          testGroupID=$(id -g)
          KACT_LOG_LEVEL=warn task test:act:nb -- -ugid "$testUserID:$testGroupID"

      - name: Prune Docker
        if: ${{ always() }}
        run: docker rm $(docker ps -a -q) -f ; docker network prune -f ; docker volume prune -f || true

      - name: Show error log
        if: ${{ failure() }}
        run: grep -C 20 -s -i -r -e 'kwild version' -e 'error' -e 'warn'  /tmp/TestKwil*/*.log /tmp/TestKwil*/*/*.log
